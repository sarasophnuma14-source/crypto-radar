# Despliegue en Render (Blueprint), plan GRATIS.
# Un solo servicio: panel web + escáner cada 4 h + vigilancia de precio cada 15 min.
# Limitaciones del plan gratis: el disco se borra en cada reinicio/despliegue (historial, posiciones y diario
# se pierden); por eso Telegram y los ajustes clave van como variables de entorno.
services:
  - type: web
    name: crypto-radar
    runtime: python
    region: frankfurt          # Binance bloquea IPs de EE. UU.
    plan: free
    buildCommand: "echo sin dependencias"
    startCommand: "python main.py serve"
    healthCheckPath: /healthz
    envVars:
      - key: CRYPTO_RADAR_HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: KEEPALIVE
        value: "1"             # se visita a sí mismo cada 10 min para que Render no lo duerma
      - key: CRYPTO_RADAR_PASSWORD
        sync: false            # contraseña del panel (Render te la pide)
      - key: TELEGRAM_BOT_TOKEN
        sync: false            # opcional: alertas al celular
      - key: TELEGRAM_CHAT_ID
        sync: false

  # Web de ventas: sitio estático gratis (no se duerme ni consume las 750 h del plan gratis).
  - type: web
    name: crypto-radar-ventas
    runtime: static
    buildCommand: "echo sitio estatico"
    staticPublishPath: ./ventas
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
