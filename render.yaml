# Despliegue en Render (Blueprint), plan GRATIS.
# Un solo servicio: web de ventas (/), inicio de sesión (/entrar) y panel (/app) + escáner cada 4 h
# + vigilancia de precio cada 15 min.
# Limitaciones del plan gratis: el disco se borra en cada reinicio/despliegue (historial, posiciones y diario
# se pierden); por eso Telegram y los ajustes clave van como variables de entorno.
services:
  - type: web
    name: crypto-radar
    runtime: python
    region: frankfurt          # Binance bloquea IPs de EE. UU.
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python main.py serve"
    healthCheckPath: /healthz
    envVars:
      - key: CRYPTO_RADAR_HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: KEEPALIVE
        value: "1"             # se visita a sí mismo cada 10 min para que Render no lo duerma
      - key: CRYPTO_RADAR_PASSWORD
        sync: false            # contraseña del panel (Render te la pide)
      - key: TELEGRAM_BOT_TOKEN
        sync: false            # opcional: alertas al celular
      - key: TELEGRAM_CHAT_ID
        sync: false
      # ---- Modo SaaS (cuentas, planes y pagos). Ver docs/DESPLIEGUE.md antes de activarlo. ----
      - key: CRYPTO_RADAR_ACCOUNTS
        sync: false            # "1" activa cuentas; déjalo vacío para el modo de un solo usuario actual
      - key: DATABASE_URL
        sync: false            # PostgreSQL (Neon gratis). Obligatorio con cuentas: el disco de Render se borra
      - key: CRYPTO_RADAR_ADMIN_USER
        sync: false            # usuario del administrador (se crea al arrancar; aprueba las solicitudes de acceso)
      - key: CRYPTO_RADAR_ADMIN_PASSWORD
        sync: false            # contraseña del administrador, mínimo 12 caracteres
      - key: WOMPI_PUBLIC_KEY
        sync: false
      - key: WOMPI_INTEGRITY_SECRET
        sync: false
      - key: WOMPI_EVENTS_SECRET
        sync: false
      - key: COP_PER_USD
        sync: false
      - key: NOWPAYMENTS_API_KEY
        sync: false
      - key: NOWPAYMENTS_IPN_SECRET
        sync: false
